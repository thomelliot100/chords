<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Songbook</title>
  <meta name="theme-color" content="#12141a" />

  <!-- Add-to-home-screen (iOS) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Songbook" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===================== LIBRARY ===================== -->
  <section id="library">
    <div class="lib-header">
      <h1>🎸 Songbook</h1>
      <span class="count" id="count"></span>
      <button class="version-badge" id="versionBadge" aria-label="App version — tap to check for updates"></button>
      <button class="btn lib-action hidden" id="restoreBtn"></button>
      <button class="btn lib-action" id="importBtn">＋ Import</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search songs or artists…" autocomplete="off" autocorrect="off" spellcheck="false" />
    </div>
    <div class="filter-row" role="group" aria-label="Filter by capo">
      <button class="chip" data-capo="all">All</button>
      <button class="chip" data-capo="yes">Capo</button>
      <button class="chip" data-capo="no">No capo</button>
    </div>
    <div id="songList"></div>
  </section>

  <!-- ===================== VIEWER ===================== -->
  <section id="viewer" class="hidden">
    <div class="toolbar">
      <button class="btn" id="backBtn" aria-label="Back to song list">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 11.2 12 4l9 7.2" />
          <path d="M5.5 9.8V19a1 1 0 0 0 1 1H10v-5h4v5h3.5a1 1 0 0 0 1-1V9.8" />
        </svg>
      </button>

      <button class="btn" id="prevBtn" aria-label="Previous song">‹</button>
      <button class="btn" id="nextBtn" aria-label="Next song">›</button>

      <div class="song-head">
        <div id="songTitle">—</div>
        <div id="songMeta"></div>
      </div>

      <div class="group" aria-label="Transpose">
        <button class="btn mini" id="transDown" aria-label="Transpose down">−</button>
        <span class="value" id="transposeLabel">0</span>
        <button class="btn mini" id="transUp" aria-label="Transpose up">＋</button>
        <span class="label">key</span>
      </div>

      <div class="group" aria-label="Text size">
        <button class="btn mini" id="fontDown" aria-label="Smaller text">A−</button>
        <button class="btn mini" id="fontUp" aria-label="Larger text">A＋</button>
      </div>

      <div class="speed-wrap">
        <span class="label">speed</span>
        <input id="speedInput" type="range" min="1" max="10" step="1" value="3" aria-label="Auto-scroll speed" />
      </div>
      <button class="btn" id="playBtn" aria-label="Start auto-scroll"><span class="play-icon"></span></button>

      <button class="btn" id="themeBtn" aria-label="Toggle light / dark">◐</button>
    </div>

    <div id="sheet"></div>
  </section>

  <!-- ===================== HIDDEN SONGS ===================== -->
  <div id="hiddenOverlay" aria-hidden="true">
    <div class="hidden-panel" role="dialog" aria-label="Hidden songs">
      <div class="import-head">
        <strong>Hidden songs</strong>
        <button class="btn mini" id="hiddenClose" aria-label="Close hidden songs">✕</button>
      </div>
      <p class="import-hint" id="hiddenNote"></p>
      <div id="hiddenList" class="hidden-list"></div>
      <div class="import-actions">
        <button class="btn" id="hiddenRestoreAll">Restore all</button>
      </div>
    </div>
  </div>

  <!-- ===================== IMPORT ===================== -->
  <div id="importOverlay" aria-hidden="true">
    <div class="import-panel" role="dialog" aria-label="Import a song">
      <div class="import-head">
        <strong>Import a song</strong>
        <button class="btn mini" id="importClose" aria-label="Close import">✕</button>
      </div>
      <div class="import-fields">
        <input id="impTitle" placeholder="Title" autocomplete="off" />
        <input id="impArtist" placeholder="Artist" autocomplete="off" />
        <input id="impKey" placeholder="Key" autocomplete="off" />
        <input id="impCapo" type="text" placeholder="Capo" aria-label="Capo" autocomplete="off" />
      </div>
      <div class="import-file">
        <button class="btn" id="impFileBtn" type="button">📄 Open PDF or text file</button>
        <input id="impFile" type="file" accept=".pdf,.txt,.text,.cho,.crd,application/pdf,text/plain" hidden />
        <span class="import-filename" id="impFileName"></span>
      </div>
      <div class="edit-bar">
        <span class="edit-note">Editable — trim anything you don't need</span>
        <button class="btn mini" id="impTrimTop" title="Delete the first line">⤒ Cut first</button>
        <button class="btn mini" id="impTrimBottom" title="Delete the last line">⤓ Cut last</button>
        <button class="btn mini" id="impUndo" title="Undo the last cut" disabled>↶ Undo</button>
      </div>
      <textarea id="impText" placeholder="Paste the chart here, or drop a file on this box…" spellcheck="false"></textarea>
      <div class="import-hint" id="impHint"></div>
      <div class="import-preview" id="impPreview"></div>
      <div class="import-actions">
        <button class="btn" id="impBackup" title="Save all your imported songs to a file">⤓ Backup</button>
        <button class="btn" id="impRestore" title="Load a backup file from another device">⤒ Restore</button>
        <!-- No accept filter on purpose: iOS greys out files whose extension
             it can't map to a known type, which made .json backups
             unselectable in the Files picker. The file is validated on read. -->
        <input id="impBackupFile" type="file" hidden />
        <button class="btn primary" id="impSave">Add to songbook</button>
      </div>
      <button class="linkish" id="impExport">or export as a songs.js snippet</button>
    </div>
  </div>

  <!-- ===================== CHORD DIAGRAM OVERLAY ===================== -->
  <div id="chordOverlay" aria-hidden="true">
    <div id="chordOverlayBody"></div>
    <div class="chord-hint">tap to close</div>
  </div>

  <script src="songs.js"></script>
  <script src="chords.js"></script>
  <script src="app.js"></script>
  <script>
    // Song count is set by renderLibrary (it also counts imported songs).
    // Register service worker for offline use
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
